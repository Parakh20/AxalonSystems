name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_platform.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: python -m pip install -r requirements_platform.txt -r ml/requirements.txt -e . pytest pytest-timeout
      - run: PYTHONSAFEPATH=1 python -m pytest tests/backend/ -ra --strict-markers

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('website/nextjs/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: cd website/nextjs && npm ci
      - run: cd website/nextjs && npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Copy model weights placeholder if needed
        run: |
          if [ ! -f ml/checkpoints/best.pt ]; then
            echo "WARNING: best.pt missing; creating a 0-byte UI smoke-test placeholder"
            mkdir -p ml/checkpoints
            touch ml/checkpoints/best.pt
          fi

      - name: Install fixture generator dependencies
        run: python3 -m pip install opencv-python-headless numpy Pillow piexif

      - name: Set up sample mission fixture
        run: |
          python3 scripts/make_sample_mission.py
          cd tests/fixtures && zip -rq sample_mission.zip sample_mission/

      - name: Build docker-compose stack
        run: docker compose build

      - name: Start docker-compose stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 \
              && curl -fsS -o /dev/null http://localhost:3000/platform \
              && break
            echo "Waiting for services... ($i/60)"
            sleep 3
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/nextjs/package-lock.json

      - name: Install npm deps + Playwright
        run: |
          cd website/nextjs
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_CI: "1"
        run: cd website/nextjs && npm run test:e2e

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: website/nextjs/test-results/

      - name: Stop docker-compose stack
        if: always()
        run: docker compose down
