version: "3.9"

services:
  api:
    build: .
    command: uvicorn axalon.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./ml/checkpoints:/app/ml/checkpoints:ro   # model weights
      - ./output:/app/output                        # inspection outputs
      - axalon_db:/app/db                           # SQLite database

volumes:
  axalon_db:
