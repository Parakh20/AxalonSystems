version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - axalon_data:/app/data
      - ./ml/checkpoints:/app/ml/checkpoints:ro
    environment:
      - AXALON_DB_URL=sqlite:////app/data/axalon.db
      - AXALON_API_KEY=${AXALON_API_KEY:-}
      - AXALON_OUTPUT_DIR=/app/data/output
      - AXALON_RESULTS_TTL_HOURS=${AXALON_RESULTS_TTL_HOURS:-0}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_AXALON_API_URL=${NEXT_PUBLIC_AXALON_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  axalon_data:
