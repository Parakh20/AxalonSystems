# Axalon Solar Inspection Platform — Configuration
# Edit these values for your specific drone + park setup.

# ── Model ────────────────────────────────────────────────────────────────────
model:
  weights: ml/checkpoints/best.pt
  confidence: 0.25          # Do not lower without testing — from training config
  iou_threshold: 0.45
  imgsz: 640                # Must match training size
  device: "0"               # "0" = first GPU, "cpu" = CPU fallback
  batch_size: 8

# ── Park ─────────────────────────────────────────────────────────────────────
park:
  mode: auto                # "numbered" | "unnumbered" | "auto"
  ocr_engine: easyocr       # "easyocr" | "tesseract"
  ocr_confidence: 0.70      # Min OCR confidence to accept a panel ID
  grid_min_panel_area: 500  # Min contour area (px²) for panel detection
  grid_max_panel_area: 50000
  row_cluster_tolerance_px: 30

# ── Camera / Drone ────────────────────────────────────────────────────────────
camera:
  thermal_focal_length_mm: 13.0     # Adjust for your thermal camera
  thermal_sensor_width_mm: 17.3
  rgb_focal_length_mm: 24.0
  rgb_sensor_width_mm: 35.9
  offset_px: [0, 0]                 # [dx, dy] fixed offset thermal→RGB
  alignment_mode: auto              # "gps" | "feature" | "offset" | "auto"

# ── Default Drone ──────────────────────────────────────────────────────────────
drone:
  default_altitude_m: 40.0          # Used when no EXIF altitude found

# ── Output ────────────────────────────────────────────────────────────────────
output:
  base_dir: output/
  save_annotated_thermal: true
  save_annotated_rgb: true
  save_fused_overlay: true
  report_formats:
    - json
    - excel
    - geojson
  annotated_thickness: 2
  annotated_font_scale: 0.45        # Matches src/utils.py draw_detections_severity default

# ── Thresholds ────────────────────────────────────────────────────────────────
thresholds:
  alert_on_critical: true
  min_confidence: 0.30              # Post-NMS filter (stricter than model conf)
  max_detections_per_image: 100

# ── API ───────────────────────────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000
  workers: 1                        # Keep at 1 if sharing GPU across requests
  max_upload_size_mb: 50
  results_ttl_hours: 24

# ── Database ──────────────────────────────────────────────────────────────────
database:
  url: "sqlite:///axalon_inspections.db"
  # Production: "postgresql://user:password@host:5432/axalon"

# ── Geospatial ────────────────────────────────────────────────────────────────
geo:
  default_crs: "EPSG:4326"          # WGS84 lat/lon
  default_altitude_m: 40.0          # Fallback if no EXIF altitude
